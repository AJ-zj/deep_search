name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  offline-tests:
    name: 离线单元测试（${{ matrix.os }} / Python ${{ matrix.python-version }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    env:
      # Windows runner 默认非 UTF-8，强制 UTF-8 避免中文输出报错
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行离线单元测试
        # 这些测试不联网、不需要 API Key，只验证纯逻辑
        run: python tests/test_offline.py

  import-check:
    name: 模块可导入检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 检查所有模块能否正常导入
        # 防止语法错误、循环依赖、缺失导入
        run: |
          python -c "
          import sys, importlib
          sys.path.insert(0, '.')
          mods = ['core.config','core.llm','core.tools','core.evidence',
                  'core.domain','core.amap','core.photos',
                  'agents.researcher','agents.planner','pipeline']
          for m in mods:
              importlib.import_module(m)
              print('ok', m)
          "

  secret-scan:
    name: 密钥泄露检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 确认 .env 未被提交
        run: |
          if [ -f .env ]; then
            echo "::error::.env 文件被提交到仓库，会泄露密钥！"
            exit 1
          fi
          echo "✅ .env 不存在"
      - name: 扫描源码中的疑似密钥
        run: |
          # 排除 .env.example（只有占位符）
          if grep -rEn 'sk-[A-Za-z0-9]{20,}|tvly-[A-Za-z0-9]{15,}' \
               --include='*.py' --include='*.html' --include='*.js' . ; then
            echo "::error::源码中发现疑似真实密钥"
            exit 1
          fi
          echo "✅ 未发现硬编码密钥"
