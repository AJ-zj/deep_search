<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TripResearch · 调研 → 决策</title>
<!-- Leaflet 地图（免费开源，无需 key） -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 24px 16px;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at 12% 8%, #dbeafe, transparent 42%),
                radial-gradient(circle at 88% 92%, #dcfce7, transparent 38%), #f8fafc;
    color: #0f172a;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 25px; margin: 0 0 4px; }
  .sub { color: #64748b; font-size: 13.5px; margin: 0 0 20px; }
  .card { background: #fff; border-radius: 16px; padding: 20px;
          box-shadow: 0 14px 40px rgba(30,58,138,.09); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type=text] { flex: 1 1 300px; padding: 12px 15px; font-size: 15px;
    border: 2px solid #e2e8f0; border-radius: 10px; outline: none; }
  input[type=text]:focus { border-color: #2563eb; }
  select { padding: 12px 14px; font-size: 15px; border: 2px solid #e2e8f0;
    border-radius: 10px; background: #fff; }
  button { padding: 12px 24px; font-size: 15px; font-weight: 600;
    background: #2563eb; color: #fff; border: 0; border-radius: 10px;
    cursor: pointer; white-space: nowrap; }
  button:disabled { background: #cbd5e1; cursor: not-allowed; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .chip { font-size: 12px; padding: 5px 12px; border-radius: 99px;
    border: 1px solid #e2e8f0; background: #f8fafc; color: #475569; cursor: pointer; }
  .chip.on { background: #2563eb; border-color: #2563eb; color: #fff; }
  .deepbox { display: flex; align-items: center; gap: 7px; font-size: 12.5px;
             color: #475569; cursor: pointer; user-select: none; }
  .deepbox input { width: 15px; height: 15px; cursor: pointer; accent-color: #2563eb; }
  .hint { font-size: 12px; color: #94a3b8; margin-top: 8px; }

  #progress { display: none; margin-top: 18px; }
  .bar { height: 8px; background: #e8edf5; border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; width: 0%; background: linear-gradient(90deg,#2563eb,#4ade80);
          transition: width .35s ease; }
  .ptext { font-size: 13px; color: #475569; margin-top: 8px; }

  /* 主体：左栏（地图+天气，吸顶） + 右栏（行程） */
  #main { display: none; margin-top: 20px; gap: 16px; grid-template-columns: 380px 1fr; align-items: start; }
  /* 非旅行领域：单列，不留给地图的 380px 空位 */
  #main.single { grid-template-columns: 1fr; }
  #main.single .left { display: none; }
  @media (max-width: 980px) { #main { grid-template-columns: 1fr; } }

  /* 左栏整体吸顶，里面不再各自 sticky（避免高度错乱导致地图溢出遮挡天气） */
  .left { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 16px; }
  #mapbox { background: #fff; border-radius: 16px; overflow: hidden;
            box-shadow: 0 14px 40px rgba(30,58,138,.09);
            height: 380px; flex: none; }
  #map { width: 100%; height: 380px; }
  .weather { background: #fff; border-radius: 16px; padding: 16px 18px;
             box-shadow: 0 10px 30px rgba(30,58,138,.07); }
  .weather h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase;
                letter-spacing: .05em; color: #94a3b8; font-weight: 600; }
  .wrow { display: flex; justify-content: space-between; align-items: center;
          font-size: 13px; padding: 5px 0; border-bottom: 1px dashed #eef2f7; }
  .wrow:last-child { border-bottom: 0; }
  .wdate { color: #475569; font-weight: 500; }
  .wtemps { color: #334155; }
  .wtemps b { color: #2563eb; }

  #plans { display: flex; flex-direction: column; gap: 14px; }
  .day-card { background: #fff; border-radius: 16px; padding: 18px 20px;
              box-shadow: 0 10px 30px rgba(30,58,138,.07); }
  .day-title { font-size: 16px; font-weight: 700; color: #1e3a8a;
               margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .day-title .badge { background: #2563eb; color: #fff; font-size: 12px;
                      padding: 2px 10px; border-radius: 99px; }
  .place { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px dashed #e2e8f0; }
  .place:last-child { border-bottom: 0; }
  .place img { width: 104px; height: 80px; object-fit: cover; border-radius: 10px;
               flex: none; background: #f1f5f9; }
  .pi { flex: 1; min-width: 0; }
  .pn { font-weight: 600; font-size: 14.5px; color: #0f172a; }
  .pt { font-size: 11.5px; color: #2563eb; background: #eff6ff;
        padding: 1px 8px; border-radius: 6px; margin-left: 6px; }
  .pd { font-size: 13px; color: #475569; margin-top: 4px; line-height: 1.6; }
  .pa { font-size: 12px; color: #94a3b8; margin-top: 4px; }
  .plinks { margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
  .plinks a { font-size: 12px; color: #2563eb; text-decoration: none; }
  .plinks a:hover { text-decoration: underline; }
  .pref { font-size: 11.5px; color: #94a3b8; margin-top: 4px; }
  .nearby { font-size: 12px; color: #059669; margin-top: 4px; }

  #reportMd { display: none; margin-top: 20px; }
  #error { display: none; margin-top: 14px; background: #fef2f2; color: #b91c1c;
           padding: 12px 16px; border-radius: 10px; font-size: 14px; }
  .toggle { text-align: center; margin-top: 14px; }
  .toggle button { background: #f1f5f9; color: #475569; font-weight: 500;
                   padding: 8px 18px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>TripResearch · 调研 → 决策双引擎</h1>
  <p class="sub">先调研（带来源），再排行程（带地图、实景照片、一键导航）</p>

  <div class="card">
    <div class="row">
      <select id="domain" title="调研领域">
        <option value="travel">✈️ 旅行规划</option>
        <option value="policy">📋 政策法规</option>
        <option value="ecommerce">🛒 电商内容</option>
        <option value="general">🔍 通用调研</option>
      </select>
      <input id="topic" type="text" placeholder="例如：杭州 3 天人文美食游" />
      <select id="days">
        <option value="2">2 天</option>
        <option value="3" selected>3 天</option>
        <option value="4">4 天</option>
      </select>
      <button id="go">开始规划</button>
    </div>
    <div class="chips" id="interests">
      <span class="chip on" data-v="人文">人文</span>
      <span class="chip on" data-v="美食">美食</span>
      <span class="chip" data-v="自然">自然</span>
      <span class="chip" data-v="亲子">亲子</span>
      <span class="chip" data-v="购物">购物</span>
    </div>
    <div class="chips" style="margin-top:10px">
      <label class="deepbox">
        <input type="checkbox" id="deep" />
        <span>🔬 深度调研（读整页正文 + 自动追问补搜，更慢但更准）</span>
      </label>
    </div>
    <div class="hint">地图：Leaflet + 高德真实坐标 ｜ 照片：Unsplash 实景（额度用完时自动降级为示意图）</div>

    <div id="progress">
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="ptext" id="ptext">准备中...</div>
    </div>
    <div id="error"></div>
  </div>

  <div id="main">
    <div class="left">
      <div id="mapbox"><div id="map"></div></div>
      <div class="weather" id="weather" style="display:none">
        <h3>天气预报</h3>
        <div id="weatherBody"></div>
      </div>
    </div>
    <div id="plans"></div>
  </div>

  <div class="toggle" id="mdToggle" style="display:none">
    <button id="btnMd">显示/隐藏 Markdown 原文</button>
  </div>
  <div class="card" id="reportMd" style="margin-top:14px">
    <div id="md"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const interests = new Set(['人文', '美食']);

// 领域切换：非旅行领域隐藏"天数/兴趣/地图"，只展示调研结果
const DOMAIN_PLACEHOLDER = {
  travel: '例如：杭州 3 天人文美食游',
  policy: '例如：浙江省分布式光伏补贴政策',
  ecommerce: '例如：抖音鞋类带货文案卖点',
  general: '例如：多模态大模型的最新进展',
};
function currentDomain() { return $('domain').value; }
function syncDomainUI() {
  const d = currentDomain();
  $('topic').placeholder = DOMAIN_PLACEHOLDER[d] || '输入研究主题';
  const travel = d === 'travel';
  $('days').style.display = travel ? '' : 'none';
  $('interests').style.display = travel ? 'flex' : 'none';
}

document.querySelectorAll('#interests .chip').forEach(el => {
  el.onclick = () => {
    const v = el.dataset.v;
    if (interests.has(v)) { interests.delete(v); el.classList.remove('on'); }
    else { interests.add(v); el.classList.add('on'); }
  };
});
$('domain').addEventListener('change', syncDomainUI);
syncDomainUI();

let map = null;
let markers = [];

function initMap() {
  if (map) return;
  map = L.map('map', { zoomControl: true }).setView([30.25, 120.15], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function inline(s) {
  let o = esc(s);
  o = o.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  o = o.replace(/`([^`]+)`/g, '<code>$1</code>');
  o = o.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return o;
}
function renderMd(md) {
  const out = []; let inUl = false;
  const closeUl = () => { if (inUl) { out.push('</ul>'); inUl = false; } };
  for (const raw of String(md || '').split('\n')) {
    const t = raw.trim();
    if (!t) { closeUl(); continue; }
    if (/^---+$/.test(t)) { closeUl(); out.push('<hr/>'); continue; }
    if (t.startsWith('>')) { closeUl(); out.push('<blockquote>' + inline(t.slice(1).trim()) + '</blockquote>'); continue; }
    const h = /^(#{1,6})\s+(.*)$/.exec(t);
    if (h) { closeUl(); const n = h[1].length; out.push(`<h${n}>${inline(h[2])}</h${n}>`); continue; }
    const li = /^[-*]\s+(.*)$/.exec(t);
    if (li) { if (!inUl) { out.push('<ul>'); inUl = true; } out.push('<li>' + inline(li[1]) + '</li>'); continue; }
    closeUl(); out.push('<p>' + inline(t) + '</p>');
  }
  closeUl(); return out.join('\n');
}

function renderCard(card) {
  // 政策卡片：把调研发现整理成结构化要点
  if (!card) return '';
  const rows = [
    ['政策名称', card.title],
    ['文号', card.doc_no],
    ['发布主体', card.issuer],
    ['有效期', card.effective],
    ['适用对象', card.scope],
  ];
  let html = '<div class="day-card" style="margin-bottom:14px">'
    + '<div class="day-title"><span class="badge">政策卡片</span>结构化要点</div>';
  rows.forEach(([k, v]) => {
    if (v) html += `<div style="display:flex;gap:10px;padding:5px 0;font-size:13.5px">
      <span style="color:#94a3b8;flex:none;width:72px">${k}</span>
      <span style="color:#0f172a">${esc(v)}</span></div>`;
  });
  if (card.subsidy && card.subsidy.length) {
    html += `<div style="display:flex;gap:10px;padding:5px 0;font-size:13.5px">
      <span style="color:#94a3b8;flex:none;width:72px">补贴标准</span>
      <div>${card.subsidy.map(s => `<div style="color:#0f172a">${esc(s)}</div>`).join('')}</div></div>`;
  }
  if (card.key_points && card.key_points.length) {
    html += `<div style="display:flex;gap:10px;padding:5px 0;font-size:13.5px">
      <span style="color:#94a3b8;flex:none;width:72px">其他要点</span>
      <div>${card.key_points.slice(0,5).map(s => `<div style="color:#475569">· ${esc(s)}</div>`).join('')}</div></div>`;
  }
  html += '</div>';
  return html;
}

const LEVEL_COLOR = { S: '#059669', A: '#0891b2', B: '#d97706', C: '#94a3b8', D: '#dc2626' };

function renderFindings(pack, domain, card) {
  // 非旅行领域：没有行程/地图，直接展示"带来源的调研发现"
  const box = $('plans'); box.innerHTML = '';
  const findings = (pack && pack.findings) || [];

  // 顶部：政策卡片（若有）
  if (card) box.innerHTML += renderCard(card);

  const c = document.createElement('div');
  c.className = 'day-card';
  const st = pack.stats || {};
  const byLv = st.by_level || {};
  let lvHtml = Object.keys(byLv).sort()
    .map(k => `<span style="color:${LEVEL_COLOR[k] || '#94a3b8'};margin-left:8px">${k}级 ${byLv[k]}条</span>`)
    .join('');
  let html = `<div class="day-title"><span class="badge">调研</span>${esc(pack.topic || '')}</div>`;
  html += `<div style="font-size:13px;color:#64748b;margin-bottom:10px">
             共 ${findings.length} 条带来源的发现${lvHtml}</div>`;
  findings.forEach((f, i) => {
    const lv = f.level || '';
    const badge = lv ? `<span style="font-size:11px;color:${LEVEL_COLOR[lv] || '#94a3b8'};
      border:1px solid ${LEVEL_COLOR[lv] || '#94a3b8'};border-radius:5px;padding:0 5px;margin-left:6px">${lv}</span>` : '';
    html += `<div class="place"><div class="pi" style="width:100%">
      <div class="pn"><span style="color:#94a3b8;margin-right:6px">${i + 1}</span>${esc(f.claim)}${badge}</div>
      ${f.source ? `<div class="pa">🔗 <a href="${esc(f.source)}" target="_blank" rel="noopener">${esc(f.source)}</a></div>` : ''}
    </div></div>`;
  });
  c.innerHTML = html;
  box.appendChild(c);
}

function renderWeather(plan) {
  const list = plan.weather || [];
  const box = $('weather'), body = $('weatherBody');
  if (!list.length) { box.style.display = 'none'; return; }
  body.innerHTML = list.map(w => `
    <div class="wrow">
      <span class="wdate">${esc(w.date)} 周${esc(w.week)}</span>
      <span class="wtemps">${esc(w.day_weather)} <b>${esc(w.day_temp)}℃</b> / ${esc(w.night_weather)} ${esc(w.night_temp)}℃</span>
    </div>`).join('');
  box.style.display = 'block';
}

function renderPlans(plan, pack) {
  const box = $('plans'); box.innerHTML = '';
  if (plan && plan.summary) {
    const s = document.createElement('div');
    s.className = 'card'; s.style.padding = '14px 18px'; s.style.fontSize = '13.5px';
    s.style.color = '#475569';
    s.textContent = plan.summary;
    box.appendChild(s);
  }
  (plan.days || []).forEach(d => {
    const card = document.createElement('div');
    card.className = 'day-card';
    let html = `<div class="day-title"><span class="badge">D${d.day}</span>第 ${d.day} 天</div>`;
    (d.places || []).forEach(p => {
      const img = p.photo_thumb || p.photo
        ? `<img src="${esc(p.photo_thumb || p.photo)}" alt="${esc(p.name)}" loading="lazy"/>`
        : `<img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='104' height='80'><rect width='104' height='80' fill='%23eef2f7'/><text x='52' y='45' font-size='11' fill='%2394a3b8' text-anchor='middle'>无图</text></svg>"/>`;
      const nav = (p.lat && p.lng)
        ? `<a href="https://uri.amap.com/marker?position=${esc(p.location || (p.lng + ',' + p.lat))}&name=${encodeURIComponent(p.name)}" target="_blank">🧭 高德导航</a>`
        : '';
      const baidu = (p.lat && p.lng)
        ? `<a href="https://api.map.baidu.com/marker?location=${esc(p.lat)},${esc(p.lng)}&title=${encodeURIComponent(p.name)}&content=${encodeURIComponent(p.address||p.name)}&output=html&src=webapp.tripresearch" target="_blank">百度地图</a>`
        : '';
      const nearby = (p.nearby && p.nearby.length)
        ? `<div class="nearby">🍜 附近：${p.nearby.map(n => esc(n.name)).join('、')}</div>` : '';
      html += `
        <div class="place">
          ${img}
          <div class="pi">
            <div class="pn">${esc(p.name)}${p.time ? `<span class="pt">${esc(p.time)}</span>` : ''}</div>
            ${p.desc ? `<div class="pd">${esc(p.desc)}</div>` : ''}
            ${p.address ? `<div class="pa">📍 ${esc(p.address)}</div>` : ''}
            ${nearby}
            <div class="plinks">${nav}${baidu}</div>
          </div>
        </div>`;
    });
    if (d.references && d.references.length) {
      html += `<div class="pref">依据调研发现：${d.references.map(r => '[' + r + ']').join('、')}</div>`;
    }
    card.innerHTML = html;
    box.appendChild(card);
  });
}

function drawMarkers(plan) {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  const pts = [];
  (plan.days || []).forEach(d => {
    (d.places || []).forEach(p => {
      if (!p.lat || !p.lng) return;
      const lat = parseFloat(p.lat), lng = parseFloat(p.lng);
      if (isNaN(lat) || isNaN(lng)) return;
      const m = L.marker([lat, lng]).addTo(map)
        .bindPopup(`<b>D${d.day} ${esc(p.name)}</b><br/>${esc(p.time || '')}<br/>${esc(p.address || '')}`);
      markers.push(m); pts.push([lat, lng]);
    });
  });
  if (pts.length) {
    try {
      map.invalidateSize();
      // 留出边距，并限制最大缩放，避免只剩一条街
      map.fitBounds(pts, { padding: [50, 50], maxZoom: 13 });
    } catch (e) { }
  }
}

let ctrl = null;
async function start() {
  const topic = $('topic').value.trim();
  if (!topic) { $('topic').focus(); return; }
  const days = parseInt($('days').value, 10);

  $('go').disabled = true;
  $('error').style.display = 'none';
  $('main').style.display = 'none';
  $('reportMd').style.display = 'none';
  $('progress').style.display = 'block';
  $('fill').style.width = '2%';
  $('ptext').textContent = '正在连接...';

  ctrl = new AbortController();
  try {
    const resp = await fetch('/api/plan/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        topic, days, interests: [...interests], domain: currentDomain(),
        deep: $('deep').checked,
      }),
      signal: ctrl.signal,
    });
    if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);

    const reader = resp.body.getReader();
    const dec = new TextDecoder('utf-8');
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) !== -1) {
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        const line = frame.split('\n').find(l => l.startsWith('data:'));
        if (!line) continue;
        let data;
        try { data = JSON.parse(line.slice(5).trim()); } catch { continue; }
        if (data.type === 'progress') {
          $('fill').style.width = (data.percentage || 0) + '%';
          $('ptext').textContent = data.text || '';
        } else if (data.type === 'status') {
          $('ptext').textContent = data.text || '';
        } else if (data.type === 'report') {
          const dom = data.domain || currentDomain();
          $('main').style.display = 'grid';
          if (dom === 'travel') {
            $('main').classList.remove('single');
            $('mapbox').style.display = '';
            $('weather').style.display = 'none';
            initMap();
            renderPlans(data.plan || {}, data.pack || {});
            renderWeather(data.plan || {});
            setTimeout(() => { map.invalidateSize(); drawMarkers(data.plan || {}); }, 120);
          } else {
            // 非旅行领域：隐藏地图与天气，只展示调研发现；左栏不再占位
            $('mapbox').style.display = 'none';
            $('weather').style.display = 'none';
            $('main').classList.add('single');
            renderFindings(data.pack || {}, dom, data.card);
          }          // Markdown 原文默认折叠，按需展开
          $('md').innerHTML = renderMd(data.data || '');
          $('reportMd').style.display = 'none';
          $('mdToggle').style.display = 'block';
        } else if (data.type === 'error') {
          $('error').style.display = 'block';
          $('error').textContent = '⚠️ ' + (data.message || '未知错误');
        }
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      $('error').style.display = 'block';
      $('error').textContent = '⚠️ 连接失败：' + (e.message || e);
    }
  } finally {
    $('go').disabled = false;
    ctrl = null;
  }
}
$('go').onclick = start;
$('topic').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
$('btnMd').onclick = () => {
  const el = $('reportMd');
  el.style.display = (el.style.display === 'none' || !el.style.display) ? 'block' : 'none';
};
</script>
</body>
